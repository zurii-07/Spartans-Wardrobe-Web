<!-- Main Page -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spartan's Wardrobe</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Email Subscription Modal -->
    <div id="emailModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Subscribe to Our Newsletter</h2>
            <p>Get the latest updates on new arrivals and exclusive offers.</p>
            <form id="emailForm">
                <input type="email" id="subscribeEmail" placeholder="Enter your email" required>
                <button type="submit">Subscribe and Continue</button>
            </form>
        </div>
    </div>

    <!-- Product Detail Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <img id="modalImage" src="" alt="Product Image">
            <h2 id="modalName"></h2>
            <p id="modalPrice"></p>
            <p id="modalDesc"></p>
            <div class="modal-options">
                <label for="modalSize">Size:</label>
                <select id="modalSize">
                    <option value="S">S</option>
                    <option value="M">M</option>
                    <option value="L">L</option>
                    <option value="XL">XL</option>
                </select>
            </div>
            <div class="modal-options">
                <label for="modalQty">Quantity:</label>
                <input type="number" id="modalQty" min="1" value="1">
            </div>
            <button id="addToCartBtn">Add to Cart</button>
        </div>
    </div>

    <!-- Cart Modal -->
    <div id="cartModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Your Cart</h2>
            <div id="cartItems"></div>
            <p id="cartTotal">Total: $0.00</p>
            <button id="checkoutBtn">Checkout</button>
        </div>
    </div>

    <!-- Navbar -->
    <header>
        <nav>
            <div class="logo">Spartan's Wardrobe</div>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#tshirts">T-Shirts</a></li>
                <li><a href="#hoodies">Hoodies</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
            <div class="cart-icon">
                <img src="images/cart.png" alt="Cart">
                <span id="cartBadge" class="badge">0</span>
            </div>
        </nav>
    </header>

    
</body>
